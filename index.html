<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor de mapas 3D</title>
  <link rel="stylesheet" href="editor.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>Editor de mapas 3D</h1>

    <section>
      <h2>Mapa</h2>
      <label>Nombre <input id="mapName" value="map1"></label>
      <label>Suelo
        <select id="floorStyle">
          <option value="grass">Césped</option>
          <option value="sand">Arena</option>
          <option value="stone">Piedra</option>
          <option value="wood">Madera</option>
          <option value="snow">Nieve</option>
          <option value="checker">Ajedrez</option>
        </select>
      </label>
      <label>Tamaño (m) <input id="mapSize" type="number" min="10" max="200" step="5" value="40"></label>
    </section>

    <section>
      <h2>Agregar objeto</h2>
      <div id="palette"></div>
    </section>

    <section>
      <h2>Herramientas</h2>
      <div class="row">
        <button id="modeT" class="on">Mover (W)</button>
        <button id="modeR">Rotar (E)</button>
      </div>
      <label class="chk"><input type="checkbox" id="snap" checked> Snap 0,5 m / 15° (G)</label>
    </section>

    <section id="props" hidden>
      <h2>Propiedades · <span id="pType"></span></h2>
      <label>Color <input type="color" data-k="color"></label>
      <label>Ancho (m) <input type="number" data-k="w" step="0.1" min="0.05"></label>
      <label>Alto (m) <input type="number" data-k="h" step="0.1" min="0.05"></label>
      <label>Profundidad (m) <input type="number" data-k="d" step="0.1" min="0.05"></label>
      <label>Elevación (m) <input type="number" data-k="y" step="0.1"></label>
      <label>Rotación (°) <input type="number" data-k="r" step="15"></label>
      <label>X <input type="number" data-k="x" step="0.5"></label>
      <label>Z <input type="number" data-k="z" step="0.5"></label>
      <label class="chk"><input type="checkbox" data-k="col"> Con colisión</label>
      <div class="row">
        <button id="dup">Duplicar (Ctrl+D)</button>
        <button id="del" class="danger">Eliminar (Supr)</button>
      </div>
    </section>

    <section>
      <div class="row">
        <button id="export" class="primary">⬇ Exportar mapa</button>
        <button id="clear">Nuevo</button>
      </div>
    </section>

    <p class="help">
      Clic: seleccionar · Arrastrar: mover por el suelo<br>
      Clic derecho: rotar cámara · Rueda: zoom<br>
      W mover · E rotar · G snap · Esc deseleccionar
    </p>
  </aside>

  <div id="view"></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
